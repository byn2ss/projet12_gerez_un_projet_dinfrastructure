id: sport_data_production_pipeline
namespace: company.hr

# =====================================================================
# --- AUTOMATISATION & PLANIFICATION (MONITORING) ---
# =====================================================================
triggers:
  - id: execution_quotidienne
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *" # S'exécute automatiquement tous les jours à 8h00

# =====================================================================
# --- EXÉCUTION DU PIPELINE (ETL DATAOPS) ---
# =====================================================================
tasks:
  - id: pipeline_etl_sport
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    
    # 1. Kestra installe automatiquement les packages requis dans le conteneur Docker
    beforeCommands:
      - pip install pandas numpy faker openpyxl requests python-dotenv geopy
    
    # 2. Activation des fichiers locaux pour pouvoir lire 'Donnees_RH.xlsx'
    namespaceFiles:
      enabled: true
    
    # 3. Déclaration des fichiers de sortie (Base SQLite et CSV pour Power BI)
    outputFiles:
      - SportData_POC.db
      - Reporting_RH_Final.csv
    
    # 4. Code Python complet embarqué et indenté pour le YAML
    script: |
      import os
      import pandas as pd
      import numpy as np
      from faker import Faker
      import random
      import sqlite3
      import requests
      import time
      from dotenv import load_dotenv
      from geopy.geocoders import Nominatim
      from geopy.distance import geodesic

      # --- 1. INITIALISATION DES PARAMÈTRES ---
      load_dotenv()

      FICHIER_RH_NOM = "Donnees_RH.xlsx"
      BASE_SQLITE_NOM = "SportData_POC.db"
      EXPORT_CSV_NOM = "Reporting_RH_Final.csv"
      
      # Récupération de la variable injectée dans Docker
      SLACK_WEBHOOK = os.getenv("SLACK_WEBHOOK_URL")
      SEUIL_SPORT = 15
      TAUX_PRIME = 0.05

      fake = Faker('fr_FR')

      if not os.path.exists(FICHIER_RH_NOM):
          raise FileNotFoundError(f"❌ Fichier source introuvable : {FICHIER_RH_NOM}")

      print(f"📖 Ouverture du référentiel RH : {FICHIER_RH_NOM}")
      fichier_rh = pd.read_excel(FICHIER_RH_NOM) 
      ID_client = fichier_rh["ID salarié"].tolist()

      commentaires_par_sport = {
          "Course à pied": ["Super running matinal !", "Record battu sur 10km", "Dur sur la fin...", "Belle sortie en ville"],
          "Vélo": ["Trajet domicile-travail au top", "Pas trop de vent aujourd'hui", "Cuisses en feu !", "Vive le vélotaf"],
          "Randonnée": ["Vue magnifique au sommet", "Sentier un peu boueux", "Bonne rando en famille"],
          "Escalade": ["Belle séance de grimpe", "Nouvelle voie validée", "Travail de la force"],
          "Marche": ["Petite marche pour s'aérer", "Objectif 10 000 pas", "Tranquille ce matin"]
      }
      type_sport = list(commentaires_par_sport.keys())

      def envoyer_notification_slack(texte_message):
          if not SLACK_WEBHOOK:
              print("⚠️ Attention : SLACK_WEBHOOK_URL non détecté par Docker !")
              return
          try:
              res = requests.post(SLACK_WEBHOOK, json={"text": texte_message}, timeout=5)
              print(f"📡 Réponse Slack : Status {res.status_code}")
          except Exception as e:
              print(f"❌ Erreur Slack : {e}")

      # --- 2. INTERCONNEXION API GÉOSPATIALE RÉELLE ---
      print("🗺️ Connexion à l'API de Géolocalisation...")
      geolocator = Nominatim(user_agent="sport_data_prod_v1")
      COORD_SIEGE = (43.5681, 3.8967) # Coordonnées de Lattes

      def calculer_distance_via_api(adresse_complete):
          try:
              location = geolocator.geocode(str(adresse_complete))
              if location:
                  coord_employe = (location.latitude, location.longitude)
                  return round(geodesic(coord_employe, COORD_SIEGE).km, 1)
          except Exception:
              pass
          return 8.0 

      fichier_rh['Distance_siege'] = fichier_rh['Adresse du domicile'].apply(calculer_distance_via_api)

      # --- 3. TRAITEMENT DU FLUX TEMPS RÉEL (2500 ÉVÉNEMENTS) ---
      print("🏃 Ingestion du flux temps réel Strava (2500 événements)...")
      historique_sport = []
      nb_publications_envoyees = 0

      for i in range(2500): 
          id_elu = random.choice(ID_client)
          employe = fichier_rh[fichier_rh["ID salarié"] == id_elu].iloc[0]
          transport_rh = str(employe['Moyen de déplacement']).lower()
          
          if "vélo" in transport_rh:
              sport = "Vélo"
          elif "running" in transport_rh or "marche" in transport_rh:
              sport = "Course à pied" if "running" in transport_rh else "Marche"
          else:
              sport = random.choice(type_sport)
              
          commentaire_elu = random.choice(commentaires_par_sport[sport])
          
          # Cohérence spatiale
          if sport != "Escalade" and ("vélo" in transport_rh or "running" in transport_rh or "marche" in transport_rh):
              distance_metres = int(employe['Distance_siege'] * 1000)
              temps_secondes = random.randint(1200, 3600)
          elif sport != "Escalade":
              distance_metres = random.randint(1000, 20000) 
              temps_secondes = random.randint(1800, 10800) 
          else:
              distance_metres = 0 # Escalade en salle
              temps_secondes = random.randint(3600, 7200)

          nouvelle_activite = {
              "ID": i + 1,
              "ID salarié": id_elu,
              "Date de début": fake.date_between(start_date='-1y', end_date='today').strftime('%d/%m/%Y %H:%M'),
              "Type": sport,
              "Distance (m)": distance_metres,
              "Temps écoulé (s)": temps_secondes,
              "Commentaire": commentaire_elu
          }
          historique_sport.append(nouvelle_activite)

          # Animation en direct sur Slack (limité à 5 pour le POC)
          if nb_publications_envoyees < 5:
              prenom = employe['Prénom']
              nom = employe['Nom']
              distance_km = round(distance_metres / 1000, 1)
              temps_min = round(temps_secondes / 60)
              
              if "Course" in sport:
                  msg = f"🤖 *[Club Sport]* : Bravo {prenom} {nom} ! Tu viens de courir {distance_km} km en {temps_min} min ! Quelle énergie ! 🔥🏅"
              elif "Vélo" in sport:
                  msg = f"🤖 *[Club Sport]* : Superbe vélotaf pour {prenom} {nom} ! {distance_km} km parcourus en {temps_min} min ! 🚴‍♂️💨"
              else:
                  msg = f"🤖 *[Club Sport]* : {prenom} {nom} a validé une session de {sport} ({temps_min} min). Ensemble vers le bien-être ! ✨"
              
              envoyer_notification_slack(msg)
              nb_publications_envoyees += 1
              time.sleep(0.5)

      df_final = pd.DataFrame(historique_sport)

      # --- 4. DATA QUALITY AUDIT (GATE) ---
      print("🛡️ Audit qualité des flux de données (Framework type Great Expectations)...")
      null_ids = df_final["ID salarié"].isnull().sum()
      invalid_distances = ((df_final["Distance (m)"] < 0) | (df_final["Distance (m)"] > 50000)).sum()
      if null_ids > 0 or invalid_distances > 0:
          raise ValueError("❌ Erreur Data Quality détectée. Pipeline stoppé.")

      print("✅ [Checkpoint] expect_column_values_to_not_be_null : CONFORME")
      print("✅ [Checkpoint] expect_column_values_to_be_between : CONFORME")

      # Calculs métiers
      fichier_rh['Eligible_Prime'] = fichier_rh['Moyen de déplacement'].str.contains('Vélo|Marche|Running', case=False, na=False)
      fichier_rh['Montant_Prime_Reel'] = np.where(fichier_rh['Eligible_Prime'], fichier_rh['Salaire brut'] * TAUX_PRIME, 0)
      stats_sport = df_final['ID salarié'].value_counts().reset_index(name='Nombre_Activites')
      fichier_rh = fichier_rh.merge(stats_sport, on='ID salarié', how='left').fillna(0)
      fichier_rh['Jour Bien être'] = np.where(fichier_rh['Nombre_Activites'] >= SEUIL_SPORT, 5, 0)
      fichier_rh['Statut_Eligibilite'] = np.where(fichier_rh['Eligible_Prime'] == True, "✅ Éligible", "❌ Non Éligible")

      # --- 5. STOCKAGE & EXPORT BI ---
      conn = sqlite3.connect(BASE_SQLITE_NOM)
      fichier_rh.to_sql('Reporting_RH', conn, if_exists='replace', index=False)
      df_final.to_sql('Flux_Activites', conn, if_exists='replace', index=False)
      conn.close()

      colonnes_kpi = ['ID salarié', 'Nom', 'Prénom', 'Moyen de déplacement', 'Distance_siege', 'Statut_Eligibilite', 'Montant_Prime_Reel', 'Nombre_Activites', 'Jour Bien être']
      fichier_rh[colonnes_kpi].to_csv(EXPORT_CSV_NOM, index=False, sep=';', decimal=',')

      # --- 6. RAPPORT FINAL DE MONITORING SUR SLACK ---
      montant_global_primes = fichier_rh['Montant_Prime_Reel'].sum()
      msg_monitoring = (
          f"🏁 *Pipeline Sport Data Executed Successfully* \n\n"
          f"🔹 *Statut Surveillance :* OK ✅\n"
          f"🔹 *Contrôle Qualité :* Conforme (Filtre type Great Expectations)\n"
          f"🔹 *Volumétrie :* 2 500 événements Strava traités\n"
          f"🔹 *Calcul Spatial :* API Géographique active (Geopy/OSM)\n"
          f"🔹 *Masse Financière Primes :* *{montant_global_primes:,.2f} €*"
      )
      print("🏁 Envoi du rapport final à Slack...")
      envoyer_notification_slack(msg_monitoring)
      print("\n🚀 PIPELINE TECHNIQUE COMPLET PASSÉ AU VERT !")
